# Rate limits for mes-ai.pingtinker.com.
#
# Install: /etc/nginx/conf.d/mes-copilot-ratelimit.conf
#
# One answered question costs 15-45 s of four CPU cores, nearly all of it local
# model inference. A handful of concurrent questions does not fail — it makes the
# demo look broken. These limits keep a public link from becoming a free GPU-less
# inference service.

limit_req_zone  $binary_remote_addr zone=mescopilot_ask:10m   rate=6r/m;
limit_req_zone  $binary_remote_addr zone=mescopilot_page:10m  rate=120r/m;
limit_conn_zone $binary_remote_addr zone=mescopilot_conn:10m;
