# Reverse proxy for the Smart CNC Factory MES Copilot.
#
#   mes-ai.pingtinker.com  ->  Next.js interface  (127.0.0.1:3020)
#
# Port 3020, not 3000
# Only the interface is proxied. The browser never calls the backend: the
# Next.js server does that over the compose network, so the tool API, the
# database and the model server stay on loopback (see docker-compose.yml).
#
# Install:
#   sudo cp deploy/nginx/mes-copilot-ratelimit.conf /etc/nginx/conf.d/
#   sudo cp deploy/nginx/mes-copilot-proxy.conf     /etc/nginx/snippets/
#   sudo cp deploy/nginx/mes-ai.pingtinker.com.conf /etc/nginx/sites-available/mes-ai.pingtinker.com
#   sudo ln -s /etc/nginx/sites-available/mes-ai.pingtinker.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d mes-ai.pingtinker.com    # appends the :443 block
#
# HTTP-only on purpose until the certificate exists: referencing a certificate
# path before it is issued stops nginx reloading at all, which would take the
# other sites on this host down with it.

server {
    listen 80;
    listen [::]:80;
    server_name mes-ai.pingtinker.com;

    # Let's Encrypt HTTP-01 challenge (webroot fallback for renewals).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        auth_basic off;
    }

    # The prototype has no authentication — it is out of scope by design
    # (brief §16) — so the public link gets a password at the door. Remove these
    # two lines to open it up.
    auth_basic           "MES Copilot demo";
    auth_basic_user_file /etc/nginx/.htpasswd-mes-copilot;

    limit_conn mescopilot_conn 20;

    # Block dotfiles (/.env, /.git) except ACME.
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Asking a question is the expensive path: one local model call to understand
    # it and one to write the answer.
    location /api/mes/ask {
        limit_req zone=mescopilot_ask burst=4 nodelay;
        proxy_pass http://127.0.0.1:3020;
        include /etc/nginx/snippets/mes-copilot-proxy.conf;
    }

    location / {
        limit_req zone=mescopilot_page burst=60 nodelay;
        proxy_pass http://127.0.0.1:3020;
        include /etc/nginx/snippets/mes-copilot-proxy.conf;
    }
}
