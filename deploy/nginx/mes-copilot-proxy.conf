# Shared proxy settings for mes-ai.pingtinker.com.
#
# Install: /etc/nginx/snippets/mes-copilot-proxy.conf
#
# Three of these are specific to this app rather than boilerplate:
#
#   buffering off  — the analysis panel is fed by server-sent events, one row per
#                    step. With nginx buffering the page would sit blank and then
#                    show everything at once, which is precisely the "watch it
#                    work" moment the demo is built around. The backend also
#                    sends X-Accel-Buffering: no; this makes it independent of that.
#   600s timeouts  — an answered question is 15-45 s of local model work on CPU,
#                    and a first, cold question can exceed a minute.
#   Host preserved — the interface renders absolute URLs from the request host.

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        "";

proxy_buffering    off;
proxy_cache        off;
proxy_read_timeout 600s;
proxy_send_timeout 600s;
