[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mes-copilot-backend"
version = "0.3.0"
description = "Smart CNC Factory MES Copilot — controlled MES tool layer and API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # The local open-weight model is reached over plain HTTP (no vendor SDK in
    # the deployment) — this is a runtime dependency of the primary LLM path.
    "httpx>=0.27",
]

[project.optional-dependencies]
# Development reference only; the client-facing architecture is local-first.
anthropic = ["anthropic>=1.0"]

dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.6", "anthropic>=1.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",   # FastAPI's Depends/Body-in-defaults is the framework's own idiom
    "UP046",  # pydantic v2 generics use Generic[T]; PEP-695 syntax is not equivalent here
]
