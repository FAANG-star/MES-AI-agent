# Smart CNC Factory MES Copilot — local development stack.
# Day 1: postgres only. backend/ and frontend/ services are enabled on Days 3 and 8.
services:
  postgres:
    image: postgres:16-alpine
    container_name: mes-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mes}
      POSTGRES_DB: ${POSTGRES_DB:-mes}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - mes_pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro   # schema.sql (and later seed.sql) run on first start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mes} -d ${POSTGRES_DB:-mes}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: mes-backend
    env_file: .env
    environment:
      # Inside the compose network the database is reachable as "postgres",
      # not localhost. The tool layer connects with the read-only role (ADR-6).
      DATABASE_URL: postgresql://${POSTGRES_USER:-mes}:${POSTGRES_PASSWORD:-mes}@postgres:5432/${POSTGRES_DB:-mes}
      DATABASE_URL_RO: postgresql://mes_ro:${MES_RO_PASSWORD:-mes_ro}@postgres:5432/${POSTGRES_DB:-mes}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # --- enabled Day 8 ---
  # frontend:
  #   build: ./frontend
  #   ports: ["3000:3000"]
  #   depends_on: [backend]

volumes:
  mes_pgdata:
