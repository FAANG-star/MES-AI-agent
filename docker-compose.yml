# Smart CNC Factory MES Copilot — local development stack.
# postgres + the local model server + the API + the web interface.
services:
  postgres:
    image: postgres:16-alpine
    container_name: mes-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mes}
      POSTGRES_DB: ${POSTGRES_DB:-mes}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - mes_pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro   # schema.sql (and later seed.sql) run on first start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mes} -d ${POSTGRES_DB:-mes}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The local open-weight model. It runs inside the application environment:
  # factory questions and MES data never leave it. Swap for vLLM or llama.cpp by
  # pointing LLM_BASE_URL elsewhere — the backend only needs an OpenAI-compatible
  # endpoint.
  ollama:
    image: ollama/ollama
    container_name: ollama
    environment:
      # Keep the model resident. Ollama unloads after 5 minutes idle by default,
      # and reloading costs a full cold start — measured at 72s for a 3B model on
      # CPU, because the cached prompt prefix is discarded with it. In a demo that
      # lands on the first question after a quiet moment.
      OLLAMA_KEEP_ALIVE: "-1"
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_models:/root/.ollama

  backend:
    build: ./backend
    container_name: mes-backend
    env_file: .env
    environment:
      # Inside the compose network the database is reachable as "postgres",
      # not localhost. The tool layer connects with the read-only role (ADR-6).
      DATABASE_URL: postgresql://${POSTGRES_USER:-mes}:${POSTGRES_PASSWORD:-mes}@postgres:5432/${POSTGRES_DB:-mes}
      DATABASE_URL_RO: postgresql://mes_ro:${MES_RO_PASSWORD:-mes_ro}@postgres:5432/${POSTGRES_DB:-mes}
      # The model server is a sibling container. Override with
      # LLM_BASE_URL_DOCKER=http://host.docker.internal:11434/v1 to use an Ollama
      # running on the host instead.
      LLM_BASE_URL: ${LLM_BASE_URL_DOCKER:-http://ollama:11434/v1}
    extra_hosts:
      # Linux does not provide host.docker.internal by default.
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started

  # The web interface. It server-renders the factory status strip and proxies
  # every API call, so the browser talks only to this origin — inside compose
  # the backend answers to a hostname a browser could not resolve anyway.
  frontend:
    build: ./frontend
    container_name: mes-frontend
    environment:
      MES_API_URL: http://backend:8000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mes_pgdata:
  ollama_models:
